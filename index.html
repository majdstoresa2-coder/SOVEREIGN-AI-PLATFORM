<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SOVEREIGN AI PLATFORM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(32px, 7vw, 64px);
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border: 1px solid #ffffff;
      border-radius: 8px;
      font-weight: bold;
    }

    p {
      opacity: 0.8;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>SOVEREIGN AI PLATFORM</h1>

    <p>
      Sovereign Artificial Intelligence Platform
    </p>

    <div class="status">
      SYSTEM ONLINE
    </div>
  </main>
</body>
</html>
