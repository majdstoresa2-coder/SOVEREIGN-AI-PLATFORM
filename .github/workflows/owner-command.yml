      # ======================================================
      # LOCATE WEB BUILD AUTOMATICALLY
      # ======================================================

      - name: Locate Deployable Web Build
        id: web_build
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATE DEPLOYABLE WEB BUILD"
          echo "=========================================="

          rm -rf sovereign-pages
          mkdir -p sovereign-pages

          WEB_INDEX=""

          # 1 — REAL GENERATED SOVEREIGN BUILD
          if [ -d sovereign-output ]; then
            WEB_INDEX="$(
              find sovereign-output \
                -type f \
                -name index.html \
                \( \
                  -path "*/build/index.html" \
                  -o -path "*/dist/index.html" \
                  -o -path "*/export/index.html" \
                  -o -path "*/release/index.html" \
                \) \
                -print 2>/dev/null \
                | head -n 1
            )"
          fi

          # 2 — EXISTING SOVEREIGN PLATFORM WEB ENTRY
          if [ -z "$WEB_INDEX" ] && [ -s "${GITHUB_WORKSPACE}/index.html" ]; then
            WEB_INDEX="${GITHUB_WORKSPACE}/index.html"
          fi

          if [ -z "$WEB_INDEX" ]; then
            echo "web_build_found=false" >> "$GITHUB_OUTPUT"
            echo "ERROR: No deployable Sovereign web index.html found."
            exit 1
          fi

          WEB_ROOT="$(
            dirname "$WEB_INDEX"
          )"

          echo "WEB INDEX: $WEB_INDEX"
          echo "WEB ROOT: $WEB_ROOT"

          if [ "$WEB_INDEX" = "${GITHUB_WORKSPACE}/index.html" ]; then
            cp "${GITHUB_WORKSPACE}/index.html" sovereign-pages/index.html

            if [ -f "${GITHUB_WORKSPACE}/styles.css" ]; then
              cp "${GITHUB_WORKSPACE}/styles.css" sovereign-pages/styles.css
            fi

            if [ -f "${GITHUB_WORKSPACE}/game.js" ]; then
              cp "${GITHUB_WORKSPACE}/game.js" sovereign-pages/game.js
            fi

            if [ -d "${GITHUB_WORKSPACE}/src" ]; then
              cp -R "${GITHUB_WORKSPACE}/src" sovereign-pages/src
            fi

            if [ -d "${GITHUB_WORKSPACE}/assets" ]; then
              cp -R "${GITHUB_WORKSPACE}/assets" sovereign-pages/assets
            fi
          else
            cp -R \
              "$WEB_ROOT"/. \
              sovereign-pages/
          fi

          if [ ! -s sovereign-pages/index.html ]; then
            echo "ERROR: Deployment package has no valid index.html."
            exit 1
          fi

          echo "web_build_found=true" >> "$GITHUB_OUTPUT"
          echo "web_root=$WEB_ROOT" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "DEPLOYABLE WEB BUILD VERIFIED"
          echo "=========================================="

          find sovereign-pages \
            -type f \
            -print
