name: Sovereign Owner Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "OWNER COMMAND"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  owner-command:
    name: Execute Owner Command
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sovereign AI Platform
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify Sovereign Components
        run: |
          echo "=========================================="
          echo "VERIFY SOVEREIGN OWNER COMMAND PIPELINE"
          echo "=========================================="

          test -f SOVEREIGN-AI-OWNER-COMMAND-GATEWAY-208.ts
          test -f SOVEREIGN-AI-AUTONOMOUS-RUNTIME-215.ts
          test -f SOVEREIGN-AI-BOOTSTRAP-220.ts
          test -f SOVEREIGN-AI-FINAL-RUNTIME-222.ts
          test -f SOVEREIGN-AI-REAL-COMPONENT-BINDINGS-224.ts

          echo "Required sovereign components verified."

      - name: Receive Owner Command
        env:
          OWNER_COMMAND: ${{ inputs.command }}
        run: |
          if [ -z "$OWNER_COMMAND" ]; then
            echo "ERROR: OWNER command is empty."
            exit 1
          fi

          echo "OWNER command received."

      - name: Execute Sovereign Owner Command
        env:
          OWNER_COMMAND: ${{ inputs.command }}
          SOVEREIGN_WORKSPACE: ${{ github.workspace }}
        run: |
          cat > /tmp/sovereign-owner-command.ts <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          import SovereignAIOwnerCommandGateway from "${{ github.workspace }}/SOVEREIGN-AI-OWNER-COMMAND-GATEWAY-208.ts";

          import type {
            SovereignMasterCommandEnvelope
          } from "${{ github.workspace }}/SOVEREIGN-AI-OWNER-COMMAND-GATEWAY-208.ts";

          import {
            createSovereignRealRuntime
          } from "${{ github.workspace }}/SOVEREIGN-AI-REAL-COMPONENT-BINDINGS-224.ts";

          async function main(): Promise<void> {
            const instruction =
              process.env.OWNER_COMMAND?.trim();

            if (!instruction) {
              throw new Error(
                "OWNER command is empty."
              );
            }

            const ownerId =
              "OWNER-MAJD";

            const projectId =
              "SOVEREIGN-AI-PLATFORM";

            const workspace =
              process.env.SOVEREIGN_WORKSPACE ||
              process.cwd();

            const runtimeResultFile =
              path.join(
                workspace,
                "sovereign-runtime-result.json"
              );

            console.log(
              "=========================================="
            );

            console.log(
              "SOVEREIGN OWNER COMMAND"
            );

            console.log(
              "OWNER AUTHORITY: SUPREME"
            );

            console.log(
              "COMMAND:",
              instruction
            );

            console.log(
              "=========================================="
            );

            const runtime =
              createSovereignRealRuntime(
                ownerId,
                projectId
              );

            let dispatchedRuntimeResult:
              unknown;

            const gateway =
              new SovereignAIOwnerCommandGateway({
                async validateAuthority(
                  authority
                ): Promise<boolean> {
                  return authority ===
                    "OWNER";
                },

                async dispatch(
                  command:
                    SovereignMasterCommandEnvelope
                ): Promise<unknown> {
                  console.log(
                    "OWNER COMMAND DISPATCHED"
                  );

                  console.log(
                    "COMMAND ID:",
                    command.id
                  );

                  const result =
                    await runtime.launch(
                      command.instruction
                    );

                  dispatchedRuntimeResult =
                    result;

                  fs.writeFileSync(
                    runtimeResultFile,
                    JSON.stringify(
                      result,
                      null,
                      2
                    ),
                    "utf8"
                  );

                  console.log(
                    "RUNTIME RESULT:"
                  );

                  console.log(
                    JSON.stringify(
                      result,
                      null,
                      2
                    )
                  );

                  if (
                    result.state ===
                      "FAILED" ||
                    result.state ===
                      "BLOCKED"
                  ) {
                    throw new Error(
                      `Sovereign runtime failed: state=${result.state}, error=${result.error ?? "unknown"}`
                    );
                  }

                  if (
                    !result.ready
                  ) {
                    throw new Error(
                      `Sovereign runtime did not become ready. state=${result.state}`
                    );
                  }

                  return result;
                },

                async recordEvent(
                  event
                ): Promise<void> {
                  console.log(
                    "[SOVEREIGN OWNER EVENT]",
                    event.type,
                    event.commandId
                  );
                }
              });

            const receipt =
              await gateway.receive({
                authority:
                  "OWNER",

                instruction,

                projectId,

                priority:
                  100,

                autonomous:
                  true,

                constraints: [
                  "OWNER authority remains SUPREME.",
                  "STEWARD remains delegated below OWNER.",
                  "Preserve sovereign core architecture.",
                  "Do not delete established sovereign files.",
                  "A playable game must produce real build files.",
                  "Do not report a downloadable build unless physical build files exist."
                ],

                metadata: {
                  source:
                    "SOVEREIGN-OWNER-COMMAND-WORKFLOW",

                  executionMode:
                    "AUTONOMOUS-PRODUCTION"
                }
              });

            console.log(
              "=========================================="
            );

            console.log(
              "OWNER COMMAND RECEIPT"
            );

            console.log(
              JSON.stringify(
                receipt,
                null,
                2
              )
            );

            console.log(
              "=========================================="
            );

            if (
              !receipt.accepted
            ) {
              throw new Error(
                `OWNER command rejected: ${receipt.reason}`
              );
            }

            if (
              receipt.status ===
                "FAILED" ||
              receipt.status ===
                "REJECTED"
            ) {
              throw new Error(
                `OWNER command failed: ${receipt.reason}`
              );
            }

            if (
              receipt.status !==
              "DISPATCHED"
            ) {
              throw new Error(
                `OWNER command was not dispatched. status=${receipt.status}`
              );
            }

            if (
              dispatchedRuntimeResult ===
              undefined
            ) {
              throw new Error(
                "Sovereign runtime produced no execution result."
              );
            }

            console.log(
              "SOVEREIGN OWNER COMMAND: SUCCESS"
            );

            console.log(
              "OWNER AUTHORITY: SUPREME"
            );

            console.log(
              "GATEWAY: DISPATCHED"
            );

            console.log(
              "RUNTIME: READY"
            );
          }

          main().catch(
            (
              error: unknown
            ) => {
              console.error(
                "=========================================="
              );

              console.error(
                "SOVEREIGN OWNER COMMAND FAILED"
              );

              console.error(
                "=========================================="
              );

              if (
                error instanceof Error
              ) {
                console.error(
                  error.stack ??
                    error.message
                );
              } else {
                console.error(
                  String(error)
                );
              }

              process.exit(1);
            }
          );
          EOF

          npx tsx /tmp/sovereign-owner-command.ts

      - name: Verify Runtime Result
        run: |
          echo "=========================================="
          echo "VERIFY SOVEREIGN RUNTIME RESULT"
          echo "=========================================="

          if [ ! -f sovereign-runtime-result.json ]; then
            echo "ERROR: sovereign-runtime-result.json was not generated."
            exit 1
          fi

          test -s sovereign-runtime-result.json

          echo "Runtime result exists."

      - name: Locate Real Game Build
        id: locate_build
        shell: bash
        run: |
          echo "=========================================="
          echo "LOCATE REAL SOVEREIGN GAME BUILD"
          echo "=========================================="

          mkdir -p sovereign-artifacts

          BUILD_FOUND="false"

          while IFS= read -r -d '' FILE; do
            case "$FILE" in
              ./node_modules/*)
                continue
                ;;
              ./.git/*)
                continue
                ;;
              ./sovereign-artifacts/*)
                continue
                ;;
            esac

            BUILD_FOUND="true"

            RELATIVE_PATH="${FILE#./}"

            mkdir -p \
              "sovereign-artifacts/$(dirname "$RELATIVE_PATH")"

            cp -p \
              "$FILE" \
              "sovereign-artifacts/$RELATIVE_PATH"

          done < <(
            find . \
              -type f \
              \( \
                -path "*/build/*" \
                -o -path "*/dist/*" \
                -o -path "*/export/*" \
                -o -path "*/exports/*" \
                -o -path "*/release/*" \
                -o -path "*/releases/*" \
              \) \
              -print0
          )

          if [ "$BUILD_FOUND" != "true" ]; then
            echo "ERROR: No physical game build files were produced."
            echo "The sovereign runtime reported success, but there is nothing real to download."
            echo "GAME BUILDER / CODE ENGINE must write the generated game and build files to the GitHub workspace."
            exit 1
          fi

          cp \
            sovereign-runtime-result.json \
            sovereign-artifacts/sovereign-runtime-result.json

          echo "build_found=true" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "REAL BUILD FILES FOUND"
          echo "=========================================="

          find sovereign-artifacts \
            -type f \
            -print

      - name: Verify Downloadable Build
        run: |
          echo "=========================================="
          echo "VERIFY DOWNLOADABLE BUILD"
          echo "=========================================="

          FILE_COUNT="$(
            find sovereign-artifacts \
              -type f \
              ! -name "sovereign-runtime-result.json" \
              | wc -l
          )"

          echo "Build file count: $FILE_COUNT"

          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "ERROR: Artifact contains no real build files."
            exit 1
          fi

          echo "Downloadable sovereign build verified."

      - name: Upload Sovereign Game Build
        uses: actions/upload-artifact@v4
        with:
          name: dragon-city-sovereign-build
          path: sovereign-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Owner Command Complete
        if: success()
        run: |
          echo "=========================================="
          echo "SOVEREIGN OWNER COMMAND: SUCCESS"
          echo "OWNER AUTHORITY: SUPREME"
          echo "EXECUTION PIPELINE: COMPLETED"
          echo "REAL BUILD: VERIFIED"
          echo "DOWNLOAD ARTIFACT: dragon-city-sovereign-build"
          echo "=========================================="
