name: Sovereign Owner Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "OWNER COMMAND"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  owner-command:
    name: Execute Owner Command
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sovereign AI Platform
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify Sovereign Components
        run: |
          echo "=========================================="
          echo "VERIFY SOVEREIGN OWNER COMMAND PIPELINE"
          echo "=========================================="

          test -f SOVEREIGN-AI-OWNER-COMMAND-GATEWAY-208.ts
          test -f SOVEREIGN-AI-AUTONOMOUS-RUNTIME-215.ts
          test -f SOVEREIGN-AI-BOOTSTRAP-220.ts
          test -f SOVEREIGN-AI-FINAL-RUNTIME-222.ts
          test -f SOVEREIGN-AI-REAL-COMPONENT-BINDINGS-224.ts

          echo "Required sovereign components verified."

      - name: Receive Owner Command
        env:
          OWNER_COMMAND: ${{ inputs.command }}
        run: |
          if [ -z "$OWNER_COMMAND" ]; then
            echo "ERROR: OWNER command is empty."
            exit 1
          fi

          echo "OWNER command received."

      - name: Execute Sovereign Owner Command
        env:
          OWNER_COMMAND: ${{ inputs.command }}
        run: |
          cat > /tmp/sovereign-owner-command.ts <<'EOF'
          import SovereignAIOwnerCommandGateway from "${{ github.workspace }}/SOVEREIGN-AI-OWNER-COMMAND-GATEWAY-208.ts";

          import type {
            SovereignMasterCommandEnvelope
          } from "${{ github.workspace }}/SOVEREIGN-AI-OWNER-COMMAND-GATEWAY-208.ts";

          import {
            createSovereignRealRuntime
          } from "${{ github.workspace }}/SOVEREIGN-AI-REAL-COMPONENT-BINDINGS-224.ts";

          async function main(): Promise<void> {
            const instruction =
              process.env.OWNER_COMMAND?.trim();

            if (!instruction) {
              throw new Error(
                "OWNER command is empty."
              );
            }

            const ownerId =
              "OWNER-MAJD";

            const projectId =
              "SOVEREIGN-AI-PLATFORM";

            console.log(
              "=========================================="
            );

            console.log(
              "SOVEREIGN OWNER COMMAND"
            );

            console.log(
              "OWNER AUTHORITY: SUPREME"
            );

            console.log(
              "COMMAND:",
              instruction
            );

            console.log(
              "=========================================="
            );

            const runtime =
              createSovereignRealRuntime(
                ownerId,
                projectId
              );

            const gateway =
              new SovereignAIOwnerCommandGateway({
                async validateAuthority(
                  authority
                ): Promise<boolean> {
                  return authority ===
                    "OWNER";
                },

                async dispatch(
                  command:
                    SovereignMasterCommandEnvelope
                ): Promise<unknown> {
                  console.log(
                    "OWNER COMMAND DISPATCHED"
                  );

                  console.log(
                    "COMMAND ID:",
                    command.id
                  );

                  const result =
                    await runtime.launch(
                      command.instruction
                    );

                  console.log(
                    "RUNTIME RESULT:"
                  );

                  console.log(
                    JSON.stringify(
                      result,
                      null,
                      2
                    )
                  );

                  if (
                    result.state ===
                      "FAILED" ||
                    result.state ===
                      "BLOCKED"
                  ) {
                    throw new Error(
                      `Sovereign runtime failed: state=${result.state}, error=${result.error ?? "unknown"}`
                    );
                  }

                  if (
                    !result.ready
                  ) {
                    throw new Error(
                      `Sovereign runtime did not become ready. state=${result.state}`
                    );
                  }

                  return result;
                },

                async recordEvent(
                  event
                ): Promise<void> {
                  console.log(
                    "[SOVEREIGN OWNER EVENT]",
                    event.type,
                    event.commandId
                  );
                }
              });

            const receipt =
              await gateway.receive({
                authority:
                  "OWNER",

                instruction,

                projectId,

                priority:
                  100,

                autonomous:
                  true,

                constraints: [
                  "OWNER authority remains SUPREME.",
                  "STEWARD remains delegated below OWNER.",
                  "Preserve sovereign core architecture.",
                  "Do not delete established sovereign files."
                ],

                metadata: {
                  source:
                    "SOVEREIGN-OWNER-COMMAND-WORKFLOW",

                  executionMode:
                    "AUTONOMOUS-PRODUCTION"
                }
              });

            console.log(
              "=========================================="
            );

            console.log(
              "OWNER COMMAND RECEIPT"
            );

            console.log(
              JSON.stringify(
                receipt,
                null,
                2
              )
            );

            console.log(
              "=========================================="
            );

            if (
              !receipt.accepted
            ) {
              throw new Error(
                `OWNER command rejected: ${receipt.reason}`
              );
            }

            if (
              receipt.status ===
                "FAILED" ||
              receipt.status ===
                "REJECTED"
            ) {
              throw new Error(
                `OWNER command failed: ${receipt.reason}`
              );
            }

            if (
              receipt.status !==
              "DISPATCHED"
            ) {
              throw new Error(
                `OWNER command was not dispatched. status=${receipt.status}`
              );
            }

            console.log(
              "SOVEREIGN OWNER COMMAND: SUCCESS"
            );

            console.log(
              "OWNER AUTHORITY: SUPREME"
            );

            console.log(
              "GATEWAY: DISPATCHED"
            );

            console.log(
              "RUNTIME: READY"
            );
          }

          main().catch(
            (
              error: unknown
            ) => {
              console.error(
                "=========================================="
              );

              console.error(
                "SOVEREIGN OWNER COMMAND FAILED"
              );

              console.error(
                "=========================================="
              );

              if (
                error instanceof Error
              ) {
                console.error(
                  error.stack ??
                    error.message
                );
              } else {
                console.error(
                  String(error)
                );
              }

              process.exit(1);
            }
          );
          EOF

          npx tsx /tmp/sovereign-owner-command.ts

      - name: Owner Command Complete
        if: success()
        run: |
          echo "=========================================="
          echo "SOVEREIGN OWNER COMMAND: SUCCESS"
          echo "OWNER AUTHORITY: SUPREME"
          echo "EXECUTION PIPELINE: COMPLETED"
          echo "=========================================="
